<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مراجعة واعتماد</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f5f5f5; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: right; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; font-weight: 600; }
        button { padding: 8px 12px; background: #667eea; color: white; border: none; cursor: pointer; margin: 5px; }
        .btn-approve { background: #28a745; }
        .btn-reject { background: #ff6b6b; }
    </style>
</head>
<body>
    <header><h1>🔍 مراجعة واعتماد</h1></header>
    <div class="container">
        <div class="card">
            <h3>📦 الفواتير المعلقة</h3>
            {% if purchases %}
            <table>
                <thead><tr><th>#</th><th>المورد</th><th>الإجراء</th></tr></thead>
                <tbody>
                    {% for p in purchases %}
                    <tr>
                        <td>{{ p.id }}</td>
                        <td>{{ p.supplier_name }}</td>
                        <td>
                            <form method="POST" action="/purchases/{{ p.id }}/review" style="display:inline;">
                                <input type="hidden" name="action" value="approve">
                                <button class="btn-approve">✅ موافقة</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% endif %}
        </div>
    </div>
</body>
</html>
