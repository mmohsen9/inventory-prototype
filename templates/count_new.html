<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جرد جديد</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f5f5f5; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 8px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        select { width: 100%; padding: 10px; margin-bottom: 15px; }
        button { width: 100%; padding: 10px; background: #667eea; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header><h1>📝 جرد جديد</h1></header>
    <div class="container">
        <div class="card">
            <form method="POST">
                <label>الموقع</label>
                <select name="location_id" required>
                    {% for loc in locations %}
                    <option value="{{ loc.id }}">{{ loc.name_ar }}</option>
                    {% endfor %}
                </select>
                <button type="submit">✅ بدء الجرد</button>
            </form>
        </div>
    </div>
</body>
</html>
