{% extends "base.html" %}

{% block title %}بدء جلسة جرد مخزني{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">
        <h2>📝 بدء جلسة جرد مخزني دوري</h2>
        <p>اختر المستودع أو الفرع الذي ترغب في جرد أصنافه ومقارنة الكميات الفعلية بالدفترية</p>
    </div>
    <div class="page-actions">
        <a href="{{ url_for('reports_variance') }}" class="btn btn-secondary">
            ⚖️ سجل فروقات الجرد السابقة
        </a>
    </div>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto 30px auto;">
    <form method="POST">
        <div class="form-group">
            <label for="location_id">الموقع / الفرع المراد جرده *</label>
            <select id="location_id" name="location_id" class="form-control" required>
                {% for loc in locations %}
                <option value="{{ loc.id }}" {% if user.location_id == loc.id %}selected{% endif %}>
                    {{ loc.name_ar }} ({{ loc.type_label_ar }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--gray-100); display: flex; justify-content: flex-end; gap: 10px;">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">إلغاء</a>
            <button type="submit" class="btn btn-primary" style="padding: 12px 28px;">
                🚀 بدء جلسة الجرد والعد &larr;
            </button>
        </div>
    </form>
</div>
{% endblock %}
