<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تحرير الجرد</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f5f5f5; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px 15px; background: #667eea; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header><h1>📝 جرد #{{ session_obj.id }}</h1></header>
    <div class="container">
        <div class="card">
            <form method="POST">
                <input type="hidden" name="action" value="add_line">
                <input type="text" name="code" placeholder="SKU" required>
                <input type="number" name="counted_quantity" placeholder="الكمية المعدودة" required>
                <button type="submit">✅ إضافة</button>
            </form>
        </div>
        <div class="card">
            <form method="POST">
                <input type="hidden" name="action" value="close_session">
                <button type="submit">🔒 إغلاق الجرد</button>
            </form>
        </div>
    </div>
</body>
</html>
