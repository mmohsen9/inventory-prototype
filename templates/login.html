<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نوفمبر كفي لإدارة المخزون</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            backdrop-filter: blur(8px);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo-circle {
            width: 64px;
            height: 64px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: var(--shadow-md);
        }

        .login-brand h2 {
            font-size: 22px;
            font-weight: 800;
            color: var(--gray-900);
        }

        .login-brand p {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .quick-users {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-200);
        }

        .quick-users h5 {
            font-size: 12px;
            font-weight: 700;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-align: center;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .quick-btn {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-700);
            cursor: pointer;
            text-align: right;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-family: inherit;
        }

        .quick-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .quick-btn span {
            font-size: 10px;
            color: var(--gray-400);
            font-weight: normal;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-logo-circle">🏢</div>
            <h2>مساكن رفاء</h2>
            <p>نظام إدخال حركات وإدارة المخزون</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm">
            <div class="form-group">
                <label for="name">اسم المستخدم</label>
                <select id="name" name="name" class="form-control" required>
                    <option value="">-- اختر المستخدم --</option>
                    {% for u in users %}
                    <option value="{{ u.name }}">{{ u.name }} ({{ u.role_label_ar }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                    required>
            </div>

            <button type="submit" class="btn btn-primary btn-block"
                style="padding: 12px; font-size: 15px; margin-top: 8px;">
                🚀 تسجيل الدخول
            </button>
        </form>

        <div class="quick-users">
            <h5>⚡ تجربة سريعة (الدخول بنقرة واحدة)</h5>
            <div class="quick-grid">
                <button type="button" class="quick-btn" onclick="quickLogin('مدير النظام', 'admin')">
                    👑 مدير النظام
                    <span>كافة الصلاحيات</span>
                </button>
                <button type="button" class="quick-btn" onclick="quickLogin('المحاسب', '1234')">
                    💼 المحاسب
                    <span>اعتماد ومراجعة وربط</span>
                </button>
                <button type="button" class="quick-btn" onclick="quickLogin('أمين المستودع', '1234')">
                    🏭 أمين المستودع
                    <span>شراء وتحويل وصرف</span>
                </button>
                <button type="button" class="quick-btn" onclick="quickLogin('موظف الفرع', '1234')">
                    🏪 موظف الفرع
                    <span>استلام وتحويل وجرد</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function quickLogin(name, pwd) {
            const select = document.getElementById('name');
            const passInput = document.getElementById('password');
            select.value = name;
            passInput.value = pwd;
            document.getElementById('loginForm').submit();
        }
    </script>
</body>

</html>
