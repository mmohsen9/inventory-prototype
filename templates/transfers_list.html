<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>التحويلات</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f5f5f5; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; font-weight: 600; }
    </style>
</head>
<body>
    <header><h1>🚚 التحويلات</h1></header>
    <div class="container">
        {% if transfers %}
        <table>
            <thead><tr><th>#</th><th>من</th><th>إلى</th><th>الحالة</th><th>الإجراء</th></tr></thead>
            <tbody>
                {% for transfer in transfers %}
                <tr><td>{{ transfer.id }}</td><td>-</td><td>-</td><td>{{ transfer.status }}</td><td><a href="/transfers/{{ transfer.id }}">عرض</a></td></tr>
                {% endfor %}
            </tbody>
        </table>
        {% endif %}
    </div>
</body>
</html>
